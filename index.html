<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenny | DEV</title>
  <meta property="og:title" content="Hey! I'm Kenny 👋" />
  <meta property="og:site_name" content="KennyDEV" />
  <meta property="og:url" content="https://kenny.is-a.dev" />
  <meta property="og:description" content="Frontend developer & more. Building clean, functional interfaces." />
  <meta property="og:image" content="https://kenny.is-a.dev/assets/images/kenny-profile.png" />
  <meta name="theme-color" content="#0571f8" />
  <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <script defer src="main.js"></script>
</head>
<body>
  <header class="header">
    <nav class="nav bd-grid">
      <a href="index.html" class="header__logo" aria-label="Home">
        Kenny<span class="header__logo--light">DEV</span>
      </a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
          <li class="nav__item"><a href="work.html" class="nav__link">Work</a></li>
          <li class="nav__item"><a href="skills.html" class="nav__link">Skills</a></li>
          <li class="nav__item"><a href="about.html" class="nav__link">About</a></li>
        </ul>
      </div>
      <div class="nav__actions">
        <label class="theme-switcher" title="Toggle theme">
          <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
          <span class="slider"></span>
        </label>
        <button class="menu-btn" aria-label="Navigation menu" aria-expanded="false">
          <span class="menu-btn__icon"></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero hero--centered bd-grid" id="home">
      <div class="hero-content">
        <p class="hero-eyebrow">Hey there <span class="wave">👋</span></p>
        <h1 class="hero-title">
          I’m <span class="text-primary">Kenny Bugeja</span>
        </h1>
        <p class="hero-subtitle">
          <span class="text-primary text-primary--bold">Frontend developer</span> + more.
          I build beautiful, functional interfaces while writing clean and efficient code.
        </p>

        <!-- Live Discord status -->
        <div id="status-badge" class="status-badge" aria-live="polite">
          <div class="status-card">
            <div class="status-header">
              <div class="status-avatar-wrap">
                <div class="status-avatar" style="background:var(--border)"></div>
                <span class="status-dot" style="background:#80848e"></span>
              </div>
              <div class="status-info">
                <span class="status-name">Loading…</span>
                <span class="status-presence">Fetching status</span>
              </div>
            </div>
          </div>
        </div>

        <div class="hero-cta">
          <a href="work.html" class="primary-button">View work</a>
          <a href="skills.html" class="secondary-button">Skills</a>
          <a href="about.html" class="secondary-button">About</a>
        </div>

        <!-- GitHub stats -->
        <div id="github-stats" class="github-stats" aria-live="polite">
          <div class="gh-stat"><span class="gh-num">—</span><span class="gh-label">Repos</span></div>
          <div class="gh-stat"><span class="gh-num">—</span><span class="gh-label">Followers</span></div>
          <div class="gh-stat"><span class="gh-num">—</span><span class="gh-label">Following</span></div>
        </div>

        <div class="hero-social">
          <a href="https://discord.com/users/681811851428102145" target="_blank" rel="noopener noreferrer" aria-label="Discord">
            <i class="bx bxl-discord-alt"></i>
          </a>
          <a href="https://github.com/KennySB-dev" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="bx bxl-github"></i>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer footer--compact">
    <div class="footer-content bd-grid">
      <div class="footer-socials">
        <a href="https://discord.com/users/681811851428102145" target="_blank" rel="noopener noreferrer" aria-label="Discord" class="social-btn social-btn--discord">
          <i class="bx bxl-discord-alt"></i>
        </a>
        <a href="https://github.com/KennySB-dev" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-btn social-btn--github">
          <i class="bx bxl-github"></i>
        </a>
      </div>
      <p class="footer-description">Made with 🧡 by Kenny</p>
    </div>
  </footer>
</body>
</html>
